pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
    }
}
rootProject.name = 'MC-World-Explorer'

include ':mc-world-explorer-sdk'
project(':mc-world-explorer-sdk').projectDir = file('sdk')

include ':mc-world-explorer-app'
project(':mc-world-explorer-app').projectDir = file('app')
