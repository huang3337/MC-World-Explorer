plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.mcworldexplorer'
version = '0.7.5-SNAPSHOT'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'com.mcworldexplorer.Launcher'
}

tasks.register('runV04JavaFx', JavaExec) {
    group = 'application'
    description = 'Runs the isolated V0.4 JavaFX 3D feasibility trial'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mcworldexplorer.experimental.v04.render.javafx.JavaFxV04Launcher'
}

dependencies {
    implementation 'net.kyori:adventure-nbt:4.17.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation platform('org.lwjgl:lwjgl-bom:3.4.1')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.joml:joml:1.10.5'
    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl::natives-windows'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.6'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('runV04Lwjgl', JavaExec) {
    group = 'application'
    description = 'Runs the isolated V0.4 LWJGL/OpenGL feasibility trial'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mcworldexplorer.experimental.v04.render.lwjgl.LwjglV04Launcher'
}

tasks.register('runV05Lwjgl', JavaExec) {
    group = 'application'
    description = 'Runs the isolated V0.5 LWJGL/OpenGL internal validation'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mcworldexplorer.experimental.v05.LwjglV05Launcher'
}

test {
    useJUnitPlatform()
}

// Use a fresh output tree so postponed classes cannot survive incremental compilation.
layout.buildDirectory = layout.projectDirectory.dir('build/core-0.7.4')

// Both repository sources and the actual host archive must remain independent of deferred work.
tasks.register('verifyCoreIsolation') {
    group = 'verification'
    dependsOn tasks.named('jar')
    doLast {
        def forbiddenRoots = ['model-plugins', 'sdk-template', 'src/sdkTools', 'src/modelTestKit']
        if (forbiddenRoots.any { file(it).exists() })
            throw new GradleException('Deferred plugin/SDK sources are not part of 0.7.4')
        if (sourceSets.names.toSet() != ['main', 'test'].toSet())
            throw new GradleException('Only core main/test source sets are allowed')
        def deferredNames = ['ApiSurfaceGenerator', 'AthenaConnectedRule', 'AthenaPaneRule', 'AthenaPatternRule', 'BlockRegistrationInfo', 'BlockRegistrationProvider', 'BlockRegistrationRegistry', 'BookPileDefinitions', 'BookPileRule', 'BuiltinModelPlugins', 'ClientBlockConstants', 'ClientBlockProperties', 'ClientBlockStates', 'ClientCanonicalItems', 'ClientEntityAppearance', 'ClientEntityMesh', 'ClientEntityModelTemplate', 'ClientEntityModels', 'ClientEntityRegistration', 'ClientEntityRequest', 'ClientModelSymbols', 'DiagonalBlocksRule', 'ExtraRotationRule', 'FabricLootrModels', 'FlowerBoxPlacement', 'FlowerBoxPlants', 'FrameBlockRule', 'FrameworkPlugin', 'GeneratedResourcePlan', 'GobletModelRule', 'IeMirrorRule', 'IeMultiblockRegistration', 'IeObjRule', 'IeSplitRule', 'ItemModelGeometry', 'ItemModelRequest', 'ItemModelTemplate', 'JarModelRule', 'LoaderBlockItemProtocol', 'LootrModelRule', 'MigrationModelRules', 'ModelPluginTestKit', 'MoonlightFluidRegistry', 'OfflineModelContext', 'PaintingRule', 'PatchModelRule', 'QuarkHedges', 'QuarkRegistrationPlugin', 'QuarkRegistrations', 'RandomRotationRule', 'RopeKnotRule', 'SavedEntityModel', 'SavedModelState', 'SoftFluidAppearance', 'SoftFluidMaterial', 'SoftFluidRequest', 'SplitModelGeometry', 'SupplementariesJarRegistration', 'SupplementariesPlugin', 'SupplementariesRegistrations', 'TwilightForestPlugin', 'VerifyFramework', 'VerifyGiant', 'WallLanternRule'].toSet()
        def forbidden = ~/.*(MigrationModelRules|PatchModelRule|SoftFluid|ClientEntity|ItemModelGeometry|ItemModelRequest|ItemModelTemplate|BlockRegistrationProvider|BlockRegistrationRegistry|LoaderBlockItemProtocol|GeneratedResourcePlan).*/
        def sourceLeaks = fileTree('src').files.findAll { it.name ==~ forbidden || deferredNames.contains(it.name.replace('.java', '')) || it.name == 'mcwe-model-plugin.json' }
        if (!sourceLeaks.isEmpty()) throw new GradleException("Deferred source found: ${sourceLeaks}")
        new java.util.jar.JarFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { jar ->
            def leaks = jar.entries().findAll { entry ->
                entry.name ==~ forbidden || deferredNames.contains(entry.name.tokenize('/').last().split('\\$')[0].replace('.class', '')) || entry.name.startsWith('org/mcwe/plugins/') ||
                    entry.name.endsWith('mcwe-model-plugin.json') || entry.name.contains('/sdktools/') || entry.name.endsWith('/ObjModelReader$GroupStyle.class')
            }.collect { it.name }
            if (!leaks.isEmpty()) throw new GradleException("Deferred code leaked into application: ${leaks}")
        }
    }
}
['check', 'installDist', 'distZip', 'distTar'].each { name ->
    tasks.named(name) { dependsOn tasks.named('verifyCoreIsolation') }
}

// Host version for inert plugin compatibility checks; no plugin or SDK is built here.
def buildMetadata = layout.buildDirectory.dir('generated/build-metadata')
tasks.register('generateBuildMetadata') {
    inputs.property('version', project.version.toString())
    outputs.dir(buildMetadata)
    doLast {
        def target = buildMetadata.get().file('mcwe-build.properties').asFile
        target.parentFile.mkdirs()
        target.text = "version=${project.version}\n"
    }
}
sourceSets.main.resources.srcDir(buildMetadata)
tasks.named('processResources') { dependsOn tasks.named('generateBuildMetadata') }
// Offline documentation only; no plugin implementation, SDK artifact or template is bundled.
tasks.named('processResources') {
    from('docs/PLUGIN_DEVELOPMENT.md') { into 'help' }
    // Share the approved artwork with the README instead of keeping a second source copy.
    from('docs/assets/mc-world-explorer.png') { into 'images' }
}
tasks.named('test') {
    doFirst {
        systemProperty 'mcwe.plugin.workerClasspath', sourceSets.main.runtimeClasspath.asPath
        systemProperty 'mcwe.plugin.testCompileClasspath', sourceSets.main.runtimeClasspath.asPath
    }
}

// Exact inputs for the reusable Windows packager, independent of old output directories.
tasks.register('prepareWindowsPackaging') {
    group = 'distribution'
    dependsOn tasks.named('installDist')
    inputs.files(configurations.runtimeClasspath)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    def manifest = layout.buildDirectory.file('packaging/runtime-files.json')
    outputs.file(manifest)
    doLast {
        def files = configurations.runtimeClasspath.files + tasks.named('jar').get().archiveFile.get().asFile
        if (files.collect { it.name }.toSet().size() != files.size())
            throw new GradleException('Packaging inputs have duplicate file names')
        def hashes = files.sort { it.name }.collectEntries { input ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            input.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            [(input.name): digest.digest().encodeHex().toString()]
        }
        def target = manifest.get().asFile
        target.parentFile.mkdirs()
        target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(hashes)), 'UTF-8')
    }
}
