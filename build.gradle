allprojects {
    group = 'com.mcworldexplorer'
    version = '0.8.1'
}

// Use a fresh output tree so postponed classes cannot survive incremental compilation.
layout.buildDirectory = layout.projectDirectory.dir('build/core-0.8.1')

subprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
    }

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        tasks.withType(Javadoc).configureEach {
            options.encoding = 'UTF-8'
        }

        tasks.named('test', Test) {
            useJUnitPlatform()
            workingDir = rootProject.projectDir
            doFirst {
                systemProperty 'mcwe.plugin.workerClasspath', sourceSets.main.runtimeClasspath.asPath
                systemProperty 'mcwe.plugin.testCompileClasspath', sourceSets.main.runtimeClasspath.asPath
            }
        }
    }
}

// Both repository sources and the actual host/SDK archives must remain independent of deferred work and UI leakage.
tasks.register('verifyCoreIsolation') {
    group = 'verification'
    description = 'Verifies deferred-code isolation across modules and zero UI/OpenGL contamination in the SDK.'
    dependsOn ':mc-world-explorer-sdk:jar', ':mc-world-explorer-app:jar'
    doLast {
        def forbiddenRoots = ['model-plugins', 'sdk-template', 'src/sdkTools', 'src/modelTestKit']
        if (forbiddenRoots.any { file(it).exists() })
            throw new GradleException('Deferred plugin/SDK sources are not part of the core application')

        def sdkProject = project(':mc-world-explorer-sdk')
        def appProject = project(':mc-world-explorer-app')
        [sdkProject, appProject].each { sub ->
            if (sub.sourceSets.names.toSet() != ['main', 'test'].toSet())
                throw new GradleException("Only core main/test source sets are allowed in ${sub.path}")
        }

        def deferredNames = [
            'ApiSurfaceGenerator', 'AthenaConnectedRule', 'AthenaPaneRule', 'AthenaPatternRule',
            'BlockRegistrationInfo', 'BlockRegistrationProvider', 'BlockRegistrationRegistry',
            'BookPileDefinitions', 'BookPileRule', 'BuiltinModelPlugins', 'ClientBlockConstants',
            'ClientBlockProperties', 'ClientBlockStates', 'ClientCanonicalItems', 'ClientEntityAppearance',
            'ClientEntityMesh', 'ClientEntityModelTemplate', 'ClientEntityModels', 'ClientEntityRegistration',
            'ClientEntityRequest', 'ClientModelSymbols', 'DiagonalBlocksRule', 'ExtraRotationRule',
            'FabricLootrModels', 'FlowerBoxPlacement', 'FlowerBoxPlants', 'FrameBlockRule',
            'FrameworkPlugin', 'GeneratedResourcePlan', 'GobletModelRule', 'IeMirrorRule',
            'IeMultiblockRegistration', 'IeObjRule', 'IeSplitRule', 'ItemModelGeometry',
            'ItemModelRequest', 'ItemModelTemplate', 'JarModelRule', 'LoaderBlockItemProtocol',
            'LootrModelRule', 'MigrationModelRules', 'ModelPluginTestKit', 'MoonlightFluidRegistry',
            'OfflineModelContext', 'PaintingRule', 'PatchModelRule', 'QuarkHedges',
            'QuarkRegistrationPlugin', 'QuarkRegistrations', 'RandomRotationRule', 'RopeKnotRule',
            'SavedEntityModel', 'SavedModelState', 'SoftFluidAppearance', 'SoftFluidMaterial',
            'SoftFluidRequest', 'SplitModelGeometry', 'SupplementariesJarRegistration',
            'SupplementariesPlugin', 'SupplementariesRegistrations', 'TwilightForestPlugin',
            'VerifyFramework', 'VerifyGiant', 'WallLanternRule'
        ].toSet()
        def forbidden = ~/.*(MigrationModelRules|PatchModelRule|SoftFluid|ClientEntity|ItemModelGeometry|ItemModelRequest|ItemModelTemplate|BlockRegistrationProvider|BlockRegistrationRegistry|LoaderBlockItemProtocol|GeneratedResourcePlan).*/

        def sourceLeaks = (fileTree('sdk/src').files + fileTree('app/src').files).findAll {
            it.name ==~ forbidden || deferredNames.contains(it.name.replace('.java', '')) || it.name == 'mcwe-model-plugin.json'
        }
        if (!sourceLeaks.isEmpty()) throw new GradleException("Deferred source found: ${sourceLeaks}")

        def sdkJarFile = sdkProject.tasks.named('jar').get().archiveFile.get().asFile
        def appJarFile = appProject.tasks.named('jar').get().archiveFile.get().asFile

        [sdkJarFile, appJarFile].each { jarFile ->
            new java.util.jar.JarFile(jarFile).withCloseable { jar ->
                def leaks = jar.entries().findAll { entry ->
                    entry.name ==~ forbidden ||
                        deferredNames.contains(entry.name.tokenize('/').last().split('\\$')[0].replace('.class', '')) ||
                        entry.name.startsWith('org/mcwe/plugins/') ||
                        entry.name.endsWith('mcwe-model-plugin.json') ||
                        entry.name.contains('/sdktools/') ||
                        entry.name.endsWith('/ObjModelReader$GroupStyle.class')
                }.collect { it.name }
                if (!leaks.isEmpty()) throw new GradleException("Deferred code leaked into ${jarFile.name}: ${leaks}")
            }
        }

        // SDK purity gate: zero JavaFX, LWJGL, Ikonli, desktop UI/update/lwjgl-render or experimental bytecode references.
        def forbiddenSdkRefs = [
            'javafx/', 'org/lwjgl/', 'org/kordamp/ikonli/',
            'com/mcworldexplorer/ui/', 'com/mcworldexplorer/update/',
            'com/mcworldexplorer/viewer/lwjgl/', 'com/mcworldexplorer/voxel/render/lwjgl/',
            'com/mcworldexplorer/experimental/', 'com/mcworldexplorer/App', 'com/mcworldexplorer/Launcher'
        ]
        new java.util.jar.JarFile(sdkJarFile).withCloseable { jar ->
            def contaminated = []
            jar.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def raw = new String(jar.getInputStream(entry).readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                    def matched = forbiddenSdkRefs.findAll { raw.contains(it) }
                    if (!matched.isEmpty()) {
                        contaminated << "${entry.name} -> ${matched}"
                    }
                }
            }
            if (!contaminated.isEmpty()) {
                throw new GradleException("SDK JAR contains forbidden UI/OpenGL/experimental references: ${contaminated}")
            }
        }
    }
}

tasks.register('assembleSdkDist', Sync) {
    group = 'distribution'
    description = 'Collects SDK binary, sources, and javadoc JARs into build/core-0.8.1/sdk-dist.'
    dependsOn ':mc-world-explorer-sdk:jar', ':mc-world-explorer-sdk:sourcesJar', ':mc-world-explorer-sdk:javadocJar', 'verifyCoreIsolation'
    from(project(':mc-world-explorer-sdk').tasks.named('jar'))
    from(project(':mc-world-explorer-sdk').tasks.named('sourcesJar'))
    from(project(':mc-world-explorer-sdk').tasks.named('javadocJar'))
    into layout.buildDirectory.dir('sdk-dist')
}

// Root-level convenience aggregate tasks preserving single-module command ergonomics.
tasks.register('test') {
    group = 'verification'
    description = 'Runs unit and integration tests for both SDK and desktop application.'
    dependsOn ':mc-world-explorer-sdk:test', ':mc-world-explorer-app:test'
}

tasks.register('check') {
    group = 'verification'
    description = 'Runs all verification checks across SDK and desktop application.'
    dependsOn ':mc-world-explorer-sdk:check', ':mc-world-explorer-app:check', 'verifyCoreIsolation'
}

tasks.register('jar') {
    group = 'build'
    description = 'Assembles JAR archives for SDK and desktop application.'
    dependsOn ':mc-world-explorer-sdk:jar', ':mc-world-explorer-app:jar'
}

tasks.register('run') {
    group = 'application'
    description = 'Runs the desktop application.'
    dependsOn ':mc-world-explorer-app:run'
}

tasks.register('prepareWindowsClient') {
    group = 'distribution'
    description = 'Prepares the isolated Windows client runtime under build/windows-client.'
    dependsOn ':mc-world-explorer-app:prepareWindowsClient'
}

tasks.register('prepareWindowsPackaging') {
    group = 'distribution'
    description = 'Prepares verified runtime inputs and SHA-256 manifest for Windows packaging.'
    dependsOn ':mc-world-explorer-app:prepareWindowsPackaging'
}

tasks.register('installDist') {
    group = 'distribution'
    dependsOn ':mc-world-explorer-app:installDist'
}

tasks.register('distZip') {
    group = 'distribution'
    dependsOn ':mc-world-explorer-app:distZip'
}

tasks.register('distTar') {
    group = 'distribution'
    dependsOn ':mc-world-explorer-app:distTar'
}

tasks.register('runV04JavaFx') {
    group = 'application'
    dependsOn ':mc-world-explorer-app:runV04JavaFx'
}

tasks.register('runV04Lwjgl') {
    group = 'application'
    dependsOn ':mc-world-explorer-app:runV04Lwjgl'
}

tasks.register('runV05Lwjgl') {
    group = 'application'
    dependsOn ':mc-world-explorer-app:runV05Lwjgl'
}
